<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت ویزیت دیجیتال هوشمند</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }
        body {
            background-color: #030305;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(168, 85, 247, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(59, 130, 246, 0.2) 0%, transparent 45%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }
        .card-container {
            width: 100%;
            max-width: 390px;
            background: rgba(13, 17, 33, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(168, 85, 247, 0.6);
            border-radius: 35px;
            padding: 35px 22px;
            box-shadow: 
                0 0 30px rgba(168, 85, 247, 0.4),
                0 0 60px rgba(59, 130, 246, 0.3),
                inset 0 0 20px rgba(168, 85, 247, 0.2);
            text-align: center;
        }
        /* عکس پروفایل مرد با هاله نئونی */
        .profile-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 18px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #3b82f6, #ec4899);
            padding: 4px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
        }
        .profile-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #0f172a;
        }
        .name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .title {
            font-size: 14px;
            color: #c084fc;
            margin-bottom: 22px;
        }
        /* گرید دکمه‌ها */
        .icon-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .icon-btn {
            width: 58px;
            height: 58px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .icon-btn:hover {
            border-color: #ec4899;
            background: rgba(51, 65, 85, 0.9);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
            transform: translateY(-2px);
        }
        .icon-btn img {
            width: 27px;
            height: 27px;
            object-fit: contain;
            display: block;
        }
        /* کادر آدرس */
        .address-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 14px;
            padding: 14px;
            margin: 20px 0;
            font-size: 13px;
            color: #cbd5e1;
            text-align: right;
            line-height: 1.5;
        }
        .address-box span {
            color: #f472b6;
            font-weight: bold;
        }
        /* بارکد QR */
        .qr-section {
            background: #ffffff;
            padding: 8px;
            border-radius: 14px;
            display: inline-block;
            margin: 5px 0 18px 0;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
        }
        .qr-section img {
            width: 120px;
            height: 120px;
            display: block;
        }
        /* دکمه‌های عملیاتی */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .main-btn {
            display: block;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.8), rgba(219, 39, 119, 0.9));
            border: 1px solid rgba(236, 72, 153, 0.7);
            border-radius: 16px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 18px rgba(147, 51, 234, 0.5);
        }
        .main-btn:hover {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9);
            transform: translateY(-2px);
        }
        .secondary-btn {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(37, 99, 235, 0.9));
            border: 1px solid rgba(96, 165, 250, 0.6);
            box-shadow: 0 4px 18px rgba(59, 130, 246, 0.4);
        }
        /* پیام هشدار */
        #toast {
            visibility: hidden;
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 12px 20px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            border: 1px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            font-size: 14px;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>

    <script>
        function shareCard() {
            if (navigator.share) {
                navigator.share({
                    title: 'کارت ویزیت دیجیتال علی رفیعی',
                    text: 'مشاهده شبکه‌ها و راه‌های ارتباطی:',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast('لینک کارت ویزیت در کلیپ‌بورد کپی شد!');
            }
        }

        function addToHomeScreen() {
            showToast('برای افزودن به هوم‌اسکرین، منوی مرورگر (سه نقطه) را بزنید و Add to Home Screen را انتخاب کنید.');
        }

        function showToast(text) {
            var x = document.getElementById("toast");
            x.innerText = text;
            x.className = "show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }
    </script>
